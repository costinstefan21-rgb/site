:`Mitglieder und Einladungen konnten nicht geladen werden.`,fr:`Impossible de charger les membres et invitations.`},"Operațiunea nu a reușit.":{en:`The operation failed.`,de:`Der Vorgang ist fehlgeschlagen.`,fr:`L’opération a échoué.`},"Introdu cel puțin două caractere pentru nume.":{en:`Enter at least two characters for your name.`,de:`Gib mindestens zwei Zeichen für deinen Namen ein.`,fr:`Saisissez au moins deux caractères pour le nom.`},"Parola trebuie să aibă minimum 8 caractere, iar confirmarea să coincidă.":{en:`Use at least 8 characters and make sure both passwords match.`,de:`Verwende mindestens 8 Zeichen; beide Passwörter müssen übereinstimmen.`,fr:`Utilisez au moins 8 caractères et deux mots de passe identiques.`},"Parola a fost schimbată.":{en:`Your password has been changed.`,de:`Dein Passwort wurde geändert.`,fr:`Votre mot de passe a été modifié.`},"Cererea a fost trimisă. Urmează instrucțiunile primite pe e-mail; poate fi necesară confirmarea pe adresa veche și pe cea nouă.":{en:`Request sent. Follow the email instructions; confirmation may be required at both the old and new addresses.`,de:`Anfrage gesendet. Folge den E-Mail-Anweisungen; möglicherweise ist eine Bestätigung an der alten und neuen Adresse erforderlich.`,fr:`Demande envoyée. Suivez les instructions reçues par e-mail ; une confirmation aux deux adresses peut être nécessaire.`},"Numele a fost salvat.":{en:`Name saved.`,de:`Name gespeichert.`,fr:`Nom enregistré.`},"Contul meu":{en:`My account`,de:`Mein Konto`,fr:`Mon compte`},"· Setările contului tău personal":{en:`· Your personal account settings`,de:`· Deine persönlichen Kontoeinstellungen`,fr:`· Paramètres de votre compte personnel`},"Nume afișat":{en:`Display name`,de:`Anzeigename`,fr:`Nom affiché`},"Acesta este numele din aplicație. Conectarea se face cu e-mailul sau cheia de acces.":{en:`This is your name in the app. Sign in with your email or passkey.`,de:`Dies ist dein Name in der App. Melde dich per E-Mail oder Passkey an.`,fr:`C’est votre nom dans l’application. Connectez-vous par e-mail ou clé d’accès.`},"Salvează numele":{en:`Save name`,de:`Namen speichern`,fr:`Enregistrer le nom`},"Adresa de e-mail":{en:`Email address`,de:`E-Mail-Adresse`,fr:`Adresse e-mail`},"Schimbă e-mailul":{en:`Change email`,de:`E-Mail ändern`,fr:`Modifier l’e-mail`},"Schimbă parola":{en:`Change password`,de:`Passwort ändern`,fr:`Modifier le mot de passe`},"Parolă nouă":{en:`New password`,de:`Neues Passwort`,fr:`Nouveau mot de passe`},"Confirmă parola":{en:`Confirm password`,de:`Passwort bestätigen`,fr:`Confirmer le mot de passe`},"Mi se cere un cod de reconfirmare":{en:`I need a verification code`,de:`Ich benötige einen Bestätigungscode`,fr:`Un code de confirmation est demandé`},"Verifică e-mailul pentru codul de reconfirmare.":{en:`Check your email for the verification code.`,de:`Prüfe deine E-Mails auf den Bestätigungscode.`,fr:`Consultez vos e-mails pour le code de confirmation.`},"Trimite codul":{en:`Send code`,de:`Code senden`,fr:`Envoyer le code`},"Cod primit":{en:`Received code`,de:`Erhaltener Code`,fr:`Code reçu`},"Salvează parola":{en:`Save password`,de:`Passwort speichern`,fr:`Enregistrer le mot de passe`},"Dispozitive conectate":{en:`Signed-in devices`,de:`Angemeldete Geräte`,fr:`Appareils connectés`},"Deconectează toate dispozitivele":{en:`Sign out of all devices`,de:`Auf allen Geräten abmelden`,fr:`Déconnecter tous les appareils`},"Va fi necesară o nouă conectare. Cheile Face ID salvate rămân disponibile.":{en:`You will need to sign in again. Saved Face ID passkeys remain available.`,de:`Du musst dich erneut anmelden. Gespeicherte Face-ID-Passkeys bleiben verfügbar.`,fr:`Vous devrez vous reconnecter. Les clés Face ID enregistrées restent disponibles.`},"Ai deschis o invitație":{en:`You opened an invitation`,de:`Du hast eine Einladung geöffnet`,fr:`Vous avez ouvert une invitation`},"Acceptă folosind contul cu adresa de e-mail invitată și confirmată.":{en:`Accept using the account with the invited and verified email address.`,de:`Nimm die Einladung mit der eingeladenen und bestätigten E-Mail-Adresse an.`,fr:`Acceptez avec le compte dont l’adresse invitée a été confirmée.`},"Ai intrat în registrul partajat.":{en:`You joined the shared ledger.`,de:`Du bist dem gemeinsamen Haushaltsbuch beigetreten.`,fr:`Vous avez rejoint le registre partagé.`},"Acceptă invitația":{en:`Accept invitation`,de:`Einladung annehmen`,fr:`Accepter l’invitation`},Renunță:{en:`Cancel`,de:`Abbrechen`,fr:`Annuler`},"Membrii registrului":{en:`Ledger members`,de:`Mitglieder des Haushaltsbuchs`,fr:`Membres du registre`},"Invitațiile vor fi disponibile după instalarea configurării „Cont și partajare” în Supabase.":{en:`Invitations require the account and sharing setup in Supabase.`,de:`Einladungen erfordern die Konto- und Freigabekonfiguration in Supabase.`,fr:`Les invitations nécessitent la configuration du compte et du partage dans Supabase.`},"Acest registru aparține lui":{en:`This ledger belongs to`,de:`Dieses Haushaltsbuch gehört`,fr:`Ce registre appartient à`},". Numai administratorul poate invita membri sau schimba permisiunile.":{en:`. Only the administrator can invite members or change permissions.`,de:`. Nur der Administrator kann Mitglieder einladen oder Berechtigungen ändern.`,fr:`. Seul l’administrateur peut inviter des membres ou modifier les autorisations.`},"Tu ești administrator. Poți adăuga maximum doi membri. Ei vor avea acces la veniturile, cheltuielile, bonurile, rapoartele și creditele acestui registru.":{en:`You are the administrator. Add up to two members with access to this ledger’s income, expenses, receipts, reports and loans.`,de:`Du bist Administrator. Du kannst bis zu zwei Mitglieder mit Zugriff auf Einnahmen, Ausgaben, Belege, Berichte und Kredite hinzufügen.`,fr:`Vous êtes administrateur. Ajoutez jusqu’à deux membres ayant accès aux revenus, dépenses, justificatifs, rapports et crédits de ce registre.`},Reîncearcă:{en:`Try again`,de:`Erneut versuchen`,fr:`Réessayer`},"E-mailul persoanei invitate":{en:`Invitee’s email`,de:`E-Mail der eingeladenen Person`,fr:`E-mail de la personne invitée`},Acces:{en:`Access`,de:`Zugriff`,fr:`Accès`},"Poate adăuga, modifica și șterge date":{en:`Can add, edit and delete data`,de:`Kann Daten hinzufügen, ändern und löschen`,fr:`Peut ajouter, modifier et supprimer des données`},"Doar citire și export":{en:`View and export only`,de:`Nur ansehen und exportieren`,fr:`Consultation et export uniquement`},"Creează invitația":{en:`Create invitation`,de:`Einladung erstellen`,fr:`Créer l’invitation`},"Invitație creată, valabilă 7 zile. Copiază linkul sau trimite-l prin e-mail.":{en:`Invitation created, valid for 7 days. Copy the link or send it by email.`,de:`Einladung erstellt, 7 Tage gültig. Kopiere den Link oder sende ihn per E-Mail.`,fr:`Invitation créée, valable 7 jours. Copiez le lien ou envoyez-le par e-mail.`},"Link invitație":{en:`Invitation link`,de:`Einladungslink`,fr:`Lien d’invitation`},"Linkul invitației a fost copiat.":{en:`Invitation link copied.`,de:`Einladungslink kopiert.`,fr:`Lien d’invitation copié.`},"Copiază linkul":{en:`Copy link`,de:`Link kopieren`,fr:`Copier le lien`},"E-mailul nu a putut fi trimis. Serviciul de invitații trebuie configurat; poți copia linkul.":{en:`Could not send email. Configure the invitation service or copy the link.`,de:`E-Mail konnte nicht gesendet werden. Konfiguriere den Einladungsdienst oder kopiere den Link.`,fr:`Impossible d’envoyer l’e-mail. Configurez le service d’invitations ou copiez le lien.`},"Invitația a fost acceptată pentru trimitere prin e-mail.":{en:`Invitation accepted for email delivery.`,de:`Einladung zum E-Mail-Versand angenommen.`,fr:`Invitation acceptée pour envoi par e-mail.`},"Trimite e-mailul":{en:`Send email`,de:`E-Mail senden`,fr:`Envoyer l’e-mail`},Permisiuni:{en:`Permissions`,de:`Berechtigungen`,fr:`Autorisations`},Editare:{en:`Edit`,de:`Bearbeiten`,fr:`Modification`},"Doar citire":{en:`Read only`,de:`Nur lesen`,fr:`Lecture seule`},"Retragi accesul lui {0} la registrul tău?":{en:`Revoke {0}’s access to your ledger?`,de:`Zugriff von {0} auf dein Haushaltsbuch widerrufen?`,fr:`Retirer à {0} l’accès à votre registre ?`},"Accesul membrului a fost revocat.":{en:`Member access revoked.`,de:`Mitgliedszugriff widerrufen.`,fr:`Accès du membre révoqué.`},"Revocă accesul":{en:`Revoke access`,de:`Zugriff widerrufen`,fr:`Révoquer l’accès`},"· invitație în așteptare":{en:`· invitation pending`,de:`· Einladung ausstehend`,fr:`· invitation en attente`},"Anulează invitația":{en:`Cancel invitation`,de:`Einladung zurückziehen`,fr:`Annuler l’invitation`},"Se deschide registrul…":{en:`Opening your ledger…`,de:`Haushaltsbuch wird geöffnet…`,fr:`Ouverture du registre…`},"Configurarea conturilor nu este finalizată":{en:`Account setup is incomplete`,de:`Kontoeinrichtung unvollständig`,fr:`Configuration des comptes incomplète`},"Registrul este pregătit pentru conturi individuale, dar trebuie conectat la baza de date înainte de publicare.":{en:`The ledger supports individual accounts but must be connected to the database before publishing.`,de:`Das Haushaltsbuch unterstützt persönliche Konten, muss aber vor der Veröffentlichung mit der Datenbank verbunden werden.`,fr:`Le registre prend en charge les comptes individuels, mais doit être connecté à la base de données avant publication.`},"Introdu numele tău.":{en:`Enter your name.`,de:`Gib deinen Namen ein.`,fr:`Saisissez votre nom.`},"Parola trebuie să aibă minimum 8 caractere.":{en:`Your password must contain at least 8 characters.`,de:`Das Passwort muss mindestens 8 Zeichen enthalten.`,fr:`Le mot de passe doit contenir au moins 8 caractères.`},"Contul a fost creat.":{en:`Account created.`,de:`Konto erstellt.`,fr:`Compte créé.`},"Autentificarea nu a reușit.":{en:`Sign-in failed.`,de:`Anmeldung fehlgeschlagen.`,fr:`Échec de la connexion.`},"E-mail sau parolă incorectă.":{en:`Incorrect email or password.`,de:`E-Mail oder Passwort falsch.`,fr:`E-mail ou mot de passe incorrect.`},"Verifică e-mailul":{en:`Check your email`,de:`Prüfe deine E-Mails`,fr:`Consultez vos e-mails`},"Am trimis un mesaj la":{en:`We sent a message to`,de:`Wir haben eine Nachricht gesendet an`,fr:`Nous avons envoyé un message à`},". Deschide linkul din mesaj, apoi te poți conecta.":{en:`. Open the link in the message, then sign in.`,de:`. Öffne den Link in der Nachricht und melde dich dann an.`,fr:`. Ouvrez le lien du message, puis connectez-vous.`},"Mergi la conectare":{en:`Go to sign in`,de:`Zur Anmeldung`,fr:`Aller à la connexion`},"Banii și bonurile tale, într-un singur loc.":{en:`Your money and receipts, all in one place.`,de:`Dein Geld und deine Belege an einem Ort.`,fr:`Votre argent et vos justificatifs au même endroit.`},"Intră de pe orice telefon sau calculator. Tot ce salvezi rămâne în contul tău.":{en:`Sign in from any phone or computer. Everything you save stays in your account.`,de:`Melde dich mit jedem Telefon oder Computer an. Alles bleibt in deinem Konto gespeichert.`,fr:`Connectez-vous depuis un téléphone ou un ordinateur. Tout reste enregistré dans votre compte.`},"Datele sunt private. Poți folosi registrul personal sau unul partajat prin invitație.":{en:`Your data is private. Use your personal ledger or a shared one by invitation.`,de:`Deine Daten sind privat. Nutze dein eigenes Haushaltsbuch oder ein per Einladung geteiltes.`,fr:`Vos données sont privées. Utilisez votre registre personnel ou un registre partagé sur invitation.`},Conectare:{en:`Sign in`,de:`Anmelden`,fr:`Connexion`},"Cont nou":{en:`New account`,de:`Neues Konto`,fr:`Nouveau compte`},"Bine ai revenit":{en:`Welcome back`,de:`Willkommen zurück`,fr:`Bon retour`},"Începe acum":{en:`Get started`,de:`Jetzt starten`,fr:`Commencer`},"Intră în cont":{en:`Sign in to your account`,de:`Bei deinem Konto anmelden`,fr:`Connectez-vous à votre compte`},"Creează contul tău":{en:`Create your account`,de:`Erstelle dein Konto`,fr:`Créez votre compte`},"Face ID / cheie de acces":{en:`Face ID / passkey`,de:`Face ID / Passkey`,fr:`Face ID / clé d’accès`},"Prima dată, intră cu parola și adaugă o cheie din Siguranță. Ulterior te poți conecta fără să scrii parola.":{en:`First sign in with your password and add a passkey under Security. Then sign in without typing your password.`,de:`Melde dich zuerst mit Passwort an und füge unter Sicherheit einen Passkey hinzu. Danach geht es ohne Passworteingabe.`,fr:`Connectez-vous d’abord avec votre mot de passe et ajoutez une clé dans Sécurité. Vous pourrez ensuite vous connecter sans saisir de mot de passe.`},"Cheile de acces nu sunt disponibile în acest browser. Folosește e-mailul și parola.":{en:`Passkeys are unavailable in this browser. Use email and password.`,de:`Passkeys sind in diesem Browser nicht verfügbar. Verwende E-Mail und Passwort.`,fr:`Les clés d’accès ne sont pas disponibles dans ce navigateur. Utilisez l’e-mail et le mot de passe.`},"Ai o invitație la un registru partajat. Conectează-te sau creează un cont cu adresa invitată, apoi acceptă invitația din Contul meu.":{en:`You have a shared ledger invitation. Sign in or create an account with the invited email, then accept it in My account.`,de:`Du hast eine Einladung zu einem gemeinsamen Haushaltsbuch. Melde dich mit der eingeladenen E-Mail an und nimm sie unter Mein Konto an.`,fr:`Vous avez une invitation à un registre partagé. Connectez-vous ou créez un compte avec l’adresse invitée, puis acceptez dans Mon compte.`},Nume:{en:`Name`,de:`Name`,fr:`Nom`},"Numele tău":{en:`Your name`,de:`Dein Name`,fr:`Votre nom`},"E-mail":{en:`Email`,de:`E-Mail`,fr:`E-mail`},Parolă:{en:`Password`,de:`Passwort`,fr:`Mot de passe`},"Ascunde parola":{en:`Hide password`,de:`Passwort verbergen`,fr:`Masquer le mot de passe`},"Arată parola":{en:`Show password`,de:`Passwort anzeigen`,fr:`Afficher le mot de passe`},"Se verifică…":{en:`Checking…`,de:`Wird geprüft…`,fr:`Vérification…`},"Intră în registru":{en:`Open ledger`,de:`Haushaltsbuch öffnen`,fr:`Ouvrir le registre`},"Creează cont":{en:`Create account`,de:`Konto erstellen`,fr:`Créer un compte`},"Ai uitat parola?":{en:`Forgot password?`,de:`Passwort vergessen?`,fr:`Mot de passe oublié ?`},"Sunt prea multe credite pentru afișare.":{en:`Too many loans to display.`,de:`Zu viele Kredite zum Anzeigen.`,fr:`Trop de crédits à afficher.`},"Secțiunea nu a putut fi încărcată. La prima utilizare, trebuie instalată configurarea „Credite” în Supabase.":{en:`Could not load this section. Install the Loans setup in Supabase before first use.`,de:`Abschnitt konnte nicht geladen werden. Installiere vor der ersten Nutzung die Kreditkonfiguration in Supabase.`,fr:`Impossible de charger cette section. Installez la configuration Crédits dans Supabase avant la première utilisation.`},"Verifică sumele, creditorul și scadențele. Soldul trebuie să fie între zero și suma inițială.":{en:`Check amounts, creditor and due dates. The balance must be between zero and the initial amount.`,de:`Prüfe Beträge, Gläubiger und Fälligkeiten. Die Restschuld muss zwischen null und dem Anfangsbetrag liegen.`,fr:`Vérifiez les montants, le créancier et les échéances. Le solde doit être compris entre zéro et le montant initial.`},"Ziua lunară trebuie să corespundă scadenței (sau ultimei zile dintr-o lună mai scurtă).":{en:`The monthly day must match the due date, or the last day of a shorter month.`,de:`Der monatliche Tag muss zur Fälligkeit passen, bei kürzeren Monaten zum letzten Tag.`,fr:`Le jour mensuel doit correspondre à l’échéance ou au dernier jour d’un mois plus court.`},"Datele au fost modificate pe alt dispozitiv. Reîncarcă lista.":{en:`Data changed on another device. Reload the list.`,de:`Daten wurden auf einem anderen Gerät geändert. Lade die Liste neu.`,fr:`Les données ont changé sur un autre appareil. Rechargez la liste.`},"Credit salvat.":{en:`Loan saved.`,de:`Kredit gespeichert.`,fr:`Crédit enregistré.`},"Creditul nu a putut fi salvat.":{en:`Could not save loan.`,de:`Kredit konnte nicht gespeichert werden.`,fr:`Impossible d’enregistrer le crédit.`},"Verifică suma plătită și data. Plata nu poate depăși soldul.":{en:`Check the payment amount and date. Payment cannot exceed the balance.`,de:`Prüfe Betrag und Zahlungsdatum. Die Zahlung darf die Restschuld nicht überschreiten.`,fr:`Vérifiez le montant et la date. Le paiement ne peut pas dépasser le solde.`},"Plata a fost salvată. Soldul și scadența au fost actualizate.":{en:`Payment saved. Balance and due date updated.`,de:`Zahlung gespeichert. Restschuld und Fälligkeit aktualisiert.`,fr:`Paiement enregistré. Solde et échéance mis à jour.`},"Plata nu a putut fi confirmată. Reîncarcă lista înainte de a reîncerca.":{en:`Could not confirm payment. Reload before trying again.`,de:`Zahlung konnte nicht bestätigt werden. Lade die Liste vor einem neuen Versuch neu.`,fr:`Impossible de confirmer le paiement. Rechargez la liste avant de réessayer.`},"Istoricul plăților nu a putut fi încărcat.":{en:`Could not load payment history.`,de:`Zahlungsverlauf konnte nicht geladen werden.`,fr:`Impossible de charger l’historique des paiements.`},"Credite și rate":{en:`Loans and instalments`,de:`Kredite und Raten`,fr:`Crédits et mensualités`},"Scadențe, plăți și datorii rămase.":{en:`Due dates, payments and outstanding debts.`,de:`Fälligkeiten, Zahlungen und Restschulden.`,fr:`Échéances, paiements et dettes restantes.`},"Adaugă credit":{en:`Add loan`,de:`Kredit hinzufügen`,fr:`Ajouter un crédit`},"Se încarcă…":{en:`Loading…`,de:`Wird geladen…`,fr:`Chargement…`},"Serviciul de notificări este conectat.":{en:`Notification service is connected.`,de:`Benachrichtigungsdienst verbunden.`,fr:`Service de notifications connecté.`},"Notificările prin e-mail nu sunt încă active sau serviciul nu a răspuns recent.":{en:`Email notifications are not active or the service has not responded recently.`,de:`E-Mail-Benachrichtigungen sind nicht aktiv oder der Dienst hat zuletzt nicht geantwortet.`,fr:`Les notifications par e-mail sont inactives ou le service n’a pas répondu récemment.`}," i.":{en:`Your face and fingerprint are not sent to the app. Verification happens on your device. Email and password remain available to recover access.`,de:`Gesicht und Fingerabdruck werden nicht an die App gesendet. Die Prüfung erfolgt auf dem Gerät. E-Mail und Passwort bleiben zur Wiederherstellung verfügbar.`,fr:`Votre visage et vos empreintes ne sont pas envoyés à l’application. La vérification se fait sur l’appareil. E-mail et mot de passe restent disponibles pour récupérer l’accès.`},"Acest browser nu permite chei de acces aici. Deschide aplicația la adresa HTTPS într-un browser compatibil.":{en:`This browser cannot use passkeys here. Open the HTTPS app in a compatible browser.`,de:`Dieser Browser unterstützt hier keine Passkeys. Öffne die HTTPS-App in einem kompatiblen Browser.`,fr:`Ce navigateur ne permet pas les clés d’accès ici. Ouvrez l’adresse HTTPS dans un navigateur compatible.`},"Se așteaptă confirmarea…":{en:`Waiting for confirmation…`,de:`Warte auf Bestätigung…`,fr:`En attente de confirmation…`},"Adaugă Face ID / cheie de acces":{en:`Add Face ID / passkey`,de:`Face ID / Passkey hinzufügen`,fr:`Ajouter Face ID / clé d’accès`},"Cheile contului tău":{en:`Your account’s passkeys`,de:`Passkeys deines Kontos`,fr:`Clés de votre compte`},"Lista cheilor nu a putut fi verificată.":{en:`Could not check passkeys.`,de:`Passkeys konnten nicht geprüft werden.`,fr:`Impossible de vérifier les clés.`},"Nu ai adăugat încă o cheie de acces.":{en:`You have not added a passkey yet.`,de:`Du hast noch keinen Passkey hinzugefügt.`,fr:`Vous n’avez pas encore ajouté de clé d’accès.`},"Cheie de acces":{en:`Passkey`,de:`Passkey`,fr:`Clé d’accès`},"Adăugată la":{en:`Added on`,de:`Hinzugefügt am`,fr:`Ajoutée le`},"Revoci această cheie? Asigură-te că îți cunoști parola sau ai altă cheie de acces.":{en:`Revoke this passkey? Make sure you know your password or have another passkey.`,de:`Diesen Passkey widerrufen? Stelle sicher, dass du dein Passwort kennst oder einen anderen Passkey d.`},"Parola a fost schimbată":{en:`Password changed`,de:`Passwort geändert`,fr:`Mot de passe modifié`},"Setează parola nouă":{en:`Set a new password`,de:`Neues Passwort festlegen`,fr:`Définir un nouveau mot de passe`},"Parola nouă este salvată. O poți folosi la următoarea conectare.":{en:`New password saved. Use it the next time you sign in.`,de:`Neues Passwort gespeichert. Verwende es bei der nächsten Anmeldung.`,fr:`Nouveau mot de passe enregistré. Utilisez-le à la prochaine connexion.`},"Dacă există un cont asociat acestei adrese, vei primi un link pentru resetarea parolei. Verifică și folderul Spam.":{en:`If an account exists for this address, you will receive a password reset link. Check Spam too.`,de:`Falls ein Konto zu dieser Adresse existiert, erhältst du einen Link zum Zurücksetzen. Prüfe auch den Spamordner.`,fr:`Si un compte existe pour cette adresse, vous recevrez un lien de réinitialisation. Vérifiez aussi les indésirables.`},"Introdu parola nouă de două ori.":{en:`Enter the new password twice.`,de:`Gib das neue Passwort zweimal ein.`,fr:`Saisissez deux fois le nouveau mot de passe.`},"Linkul lipsește, a expirat sau nu mai este valid. Introdu e-mailul pentru a solicita unul nou.":{en:`The link is missing, expired or invalid. Enter your email to request a new one.`,de:`Der Link fehlt, ist abgelaufen oder ungültig. Gib deine E-Mail für einen neuen Link ein.`,fr:`Le lien manque, a expiré ou n’est plus valide. Saisissez votre e-mail pour en demander un nouveau.`},"Introdu adresa de e-mail a contului. Îți trimitem un link pentru alegerea unei parole noi.":{en:`Enter your account email. We will send a link to choose a new password.`,de:`Gib deine Konto-E-Mail ein. Wir senden einen Link zur Wahl eines neuen Passworts.`,fr:`Saisissez l’e-mail du compte. Nous enverrons un lien pour choisir un nouveau mot de passe.`},"Parola nouă":{en:`New password`,de:`Neues Passwort`,fr:`Nouveau mot de passe`},"Confirmă parola nouă":{en:`Confirm new password`,de:`Neues Passwort bestätigen`,fr:`Confirmer le nouveau mot de passe`},"Se procesează…":{en:`Processing…`,de:`Wird verarbeitet…`,fr:`Traitement…`},"Salvează parola nouă":{en:`Save new password`,de:`Neues Passwort speichern`,fr:`Enregistrer le nouveau mot de passe`},"Trimite linkul de resetare":{en:`Send reset link`,de:`Link zum Zurücksetzen senden`,fr:`Envoyer le lien de réinitialisation`},"Înapoi la registru":{en:`Back to ledger`,de:`Zurück zum Haushaltsbuch`,fr:`Retour au registre`},"Înapoi la conectare":{en:`Back to sign in`,de:`Zurück zur Anmeldung`,fr:`Retour à la connexion`},"Se încarcă dovada…":{en:`Loading receipt…`,de:`Beleg wird geladen…`,fr:`Chargement du justificatif…`},"Nu ai acces la această dovadă sau imaginea nu mai este disponibilă.":{en:`You cannot access this receipt or the image is no longer available.`,de:`Kein Zugriff auf diesen Beleg oder das Bild ist nicht mehr verfügbar.`,fr:`Vous n’avez pas accès à ce justificatif ou l’image n’est plus disponible.`},"Permite deschiderea ferestrelor pentru acest site.":{en:`Allow pop-ups for this site.`,de:`Erlaube Pop-ups für diese Website.`,fr:`Autorisez les fenêtres surgissantes pour ce site.`},"Dovada nu a putut fi deschisă.":{en:`Could not open receipt.`,de:`Beleg konnte nicht geöffnet werden.`,fr:`Impossible d’ouvrir le justificatif.`},"Bon privat":{en:`Private receipt`,de:`Privater Beleg`,fr:`Justificatif privé`},"Deschide dovada":{en:`Open receipt`,de:`Beleg öffnen`,fr:`Ouvrir le justificatif`},"Nu putem verifica accesul la registru. Verifică internetul și reîncearcă.":{en:`Cannot verify ledger access. Check your internet and try again.`,de:`Zugriff kann nicht geprüft werden. Prüfe die Internetverbindung und versuche es erneut.`,fr:`Impossible de vérifier l’accès. Vérifiez Internet et réessayez.`},"Se verifică accesul…":{en:`Checking access…`,de:`Zugriff wird geprüft…`,fr:`Vérification de l’accès…`},"Registru indisponibil.":{en:`Ledger unavailable.`,de:`Haushaltsbuch nicht verfügbar.`,fr:`Registre indisponible.`},"Bun venit":{en:`Welcome`,de:`Willkommen`,fr:`Bienvenue`},"Nu am putut închide sesiunea.":{en:`Could not sign out.`,de:`Abmeldung fehlgeschlagen.`,fr:`Impossible de se déconnecter.`},"Venituri și cheltuieli":{en:`Income and expenses`,de:`Einnahmen und Ausgaben`,fr:`Revenus et dépenses`},"Permite deschiderea ferestrelor pentru acest site, apoi apasă din nou Export PDF.":{en:`Allow pop-ups for this site, then select Export PDF again.`,de:`Erlaube Pop-ups und wähle erneut PDF exportieren.`,fr:`Autorisez les fenêtres surgissantes, puis sélectionnez à nouveau Exporter en PDF.`},"Alege o zi validă.":{en:`Choose a valid day.`,de:`Wähle einen gültigen Tag.`,fr:`Choisissez un jour valide.`},"Completează ambele date ale intervalului.":{en:`Enter both dates for the range.`,de:`Gib beide Daten des Zeitraums ein.`,fr:`Saisissez les deux dates de l’intervalle.`},"Data de început trebuie să fie înaintea datei de sfârșit sau aceeași zi.":{en:`Start date must be on or before end date.`,de:`Das Startdatum muss vor oder am Enddatum liegen.`,fr:`La date de début doit précéder ou correspondre à la date de fin.`},"Istoricul nu a putut fi încărcat complet.":{en:`Could not load the full history.`,de:`Verlauf konnte nicht vollständig geladen werden.`,fr:`Impossible de charger tout l’historique.`},"Registrul este prea mare pentru încărcarea integrală în browser.":{en:`The ledger is too large to load fully in the browser.`,de:`Das Haushaltsbuch ist zu groß zum vollständigen Laden im Browser.`,fr:`Le registre est trop volumineux pour être entièrement chargé dans le navigateur.`},"Lună invalidă.":{en:`Invalid month.`,de:`Ungültiger Monat.`,fr:`Mois invalide.`},"Alege câteva activități gratuite și păstrează ieșirile care contează pentru tine.":{en:`Choose some free activities and keep the outings that matter to you.`,de:`Wähle kostenlose Aktivitäten und behalte die Ausflüge, die dir wichtig sind.`,fr:`Choisissez des activités gratuites et gardez les sorties qui comptent pour vous.`},"Pentru cumpărăturile neesențiale, așteaptă 48 de ore și compară prețurile înainte să cumperi.":{en:`For non-essential purchases, wait 48 hours and compare prices before buying.`,de:`Warte bei nicht notwendigen Einkäufen 48 Stunden und vergleiche vorher die Preise.`,fr:`Pour les achats non essentiels, attendez 48 heures et comparez les prix.`},"Planifică mesele și cumpără cu listă pentru a reduce risipa, fără să reduci calitatea alimentației.":{en:`Plan meals and shop with a list to reduce waste without reducing food quality.`,de:`Plane Mahlzeiten und kaufe mit Liste ein, um Verschwendung ohne Qualitätsverlust zu reduzieren.`,fr:`Planifiez les repas et utilisez une liste pour réduire le gaspillage sans diminuer la qualité alimentaire.`},"Dacă este practic, grupează drumurile sau compară alternativele pentru deplasările opționale.":{en:`Where practical, combine trips or compare alternatives for optional journeys.`,de:`Fasse Wege zusammen oder vergleiche Alternativen für optionale Fahrten, wenn praktikabel.`,fr:`Si possible, regroupez vos trajets ou comparez les alternatives pour les déplacements facultatifs.`},"Dată invalidă.":{en:`Invalid date.`,de:`Ungültiges Datum.`,fr:`Date invalide.`},"Unele înregistrări au sume sau date invalide. Verifică istoricul înainte de analiză.":{en:`Some entries have invalid amounts or dates. Check history before analysing.`,de:`Einige Einträge enthalten ungültige Beträge oder Daten. Prüfe den Verlauf vor der Analyse.`,fr:`Certaines opérations ont des montants ou dates incorrects. Vérifiez l’historique avant l’analyse.`},"Confirmarea a fost anulată sau a expirat. Poți încerca din nou ori poți folosi parola.":{en:`Confirmation cancelled or expired. Try again or use your password.`,de:`Bestätigung abgebrochen oder abgelaufen. Versuche es erneut oder verwende dein Passwort.`,fr:`Confirmation annulée ou expirée. Réessayez ou utilisez votre mot de passe.`},"Autentificarea prin cheie de acces nu este încă activată pentru această aplicație. Folosește e-mailu te automat pe zile.":{en:`Receipt photos, automatically organised by day.`,de:`Belegfotos, automatisch nach Tagen geordnet.`,fr:`Photos des justificatifs, classées automatiquement par jour.`},Bon:{en:`Receipt`,de:`Beleg`,fr:`Justificatif`},"Bon din {0}":{en:`Receipt from {0}`,de:`Beleg vom {0}`,fr:`Justificatif du {0}`},"Sesiune expirată.":{en:`Session expired.`,de:`Sitzung abgelaufen.`,fr:`Session expirée.`},"E-mail sau rol invalid.":{en:`Invalid email or role.`,de:`Ungültige E-Mail oder Rolle.`,fr:`E-mail ou rôle invalide.`},"Nu te poți invita pe tine.":{en:`You cannot invite yourself.`,de:`Du kannst dich nicht selbst einladen.`,fr:`Vous ne pouvez pas vous inviter vous-même.`},"Persoana este deja membru.":{en:`This person is already a member.`,de:`Diese Person ist bereits Mitglied.`,fr:`Cette personne est déjà membre.`},"Există deja o invitație activă. Anuleaz-o înainte să creezi alta.":{en:`An active invitation already exists. Cancel it before creating another.`,de:`Eine aktive Einladung existiert bereits. Ziehe sie zurück, bevor du eine neue erstellst.`,fr:`Une invitation active existe déjà. Annulez-la avant d’en créer une autre.`},"Poți invita cel mult doi membri. Invitațiile active rezervă un loc.":{en:`You can invite up to two members. Active invitations reserve a place.`,de:`Du kannst höchstens zwei Mitglieder einladen. Aktive Einladungen reservieren einen Platz.`,fr:`Vous pouvez inviter deux membres maximum. Les invitations actives réservent une place.`},"Ai creat prea multe invitații. Încearcă din nou mai târziu.":{en:`Too many invitations created. Try again later.`,de:`Zu viele Einladungen erstellt. Versuche es später erneut.`,fr:`Trop d’invitations créées. Réessayez plus tard.`},"Conectează-te pentru a accepta invitația.":{en:`Sign in to accept the invitation.`,de:`Melde dich an, um die Einladung anzunehmen.`,fr:`Connectez-vous pour accepter l’invitation.`},"Invitație invalidă.":{en:`Invalid invitation.`,de:`Ungültige Einladung.`,fr:`Invitation invalide.`},"Invitația a expirat, a fost folosită sau revocată.":{en:`The invitation expired, was used or revoked.`,de:`Die Einladung ist abgelaufen, wurde verwendet oder widerrufen.`,fr:`L’invitation a expiré, a été utilisée ou révoquée.`},"Folosește contul cu adresa de e-mail invitată și confirmată.":{en:`Use the account with the invited and verified email address.`,de:`Verwende das Konto mit der eingeladenen und bestätigten E-Mail-Adresse.`,fr:`Utilisez le compte avec l’adresse e-mail invitée et confirmée.`},"Registrul are deja doi membri.":{en:`The ledger already has two members.`,de:`Das Haushaltsbuch hat bereits zwei Mitglieder.`,fr:`Le registre compte déjà deux membres.`},"Rol invalid.":{en:`Invalid role.`,de:`Ungültige Rolle.`,fr:`Rôle invalide.`},"Se verifică confirmarea…":{en:`Checking confirmation…`,de:`Bestätigung wird geprüft…`,fr:`Vérification de la confirmation…`},"Cont confirmat cu succes":{en:`Account successfully confirmed`,de:`Konto erfolgreich bestätigt`,fr:`Compte confirmé avec succès`},"Confirmarea nu a putut fi verificată":{en:`Confirmation could not be verified`,de:`Die Bestätigung konnte nicht überprüft werden`,fr:`La confirmation n’a pas pu être vérifiée`},"Verificăm linkul primit prin e-mail.":{en:`We are checking the link received by email.`,de:`Wir prüfen den Link aus der E-Mail.`,fr:`Nous vérifions le lien reçu par e-mail.`},"Vă mulțumim! Contul dumneavoastră a fost confirmat cu succes. Vă puteți autentifica în aplicație.":{en:`Thank you! Your account has been confirmed successfully. You can sign in to the app.`,de:`Vielen Dank! Ihr Konto wurde erfolgreich bestätigt. Sie können sich in der App anmelden.`,fr:`Merci ! Votre compte a été confirmé avec succès. Vous pouvez vous connecter à l’application.`},"Verificați conexiunea la internet și încercați din nou.":{en:`Check your internet connection and try again.`,de:`Prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut.`,fr:`Vérifiez votre connexion Internet et réessayez.`},"Linkul poate fi expirat sau deja folosit. Dacă ați confirmat deja contul, vă puteți autentifica folosind e-mailul și parola.":{en:`The link may have expired or already been used. If you have already confirmed your account, you can sign in with your email and password.`,de:`Der Link ist möglicherweise abgelaufen oder wurde bereits verwendet. Wenn Sie Ihr Konto bereits bestätigt haben, können Sie sich mit E-Mail und Passwort anmelden.`,fr:`Le lien a peut-être expiré ou a déjà été utilisé. Si votre compte est déjà confirmé, connectez-vous avec votre e-mail et votre mot de passe.`},"Continuă în aplicație":{en:`Continue to the app`,de:`Weiter zur App`,fr:`Continuer vers l’application`},"Asistentul registrului":{en:`Ledger assistant`,de:`Registerassistent`,fr:`Assistant du registre`},"Întreabă despre banii tăi sau cere un calcul.":{en:`Ask about your money or request a calculation.`,de:`Frage nach deinen Finanzen oder fordere eine Berechnung an.`,fr:`Posez une question sur vos finances ou demandez un calcul.`},"Șterge conversația":{en:`Clear conversation`,de:`Gespräch löschen`,fr:`Effacer la conversation`},"La trimitere, întrebarea și rezumatele necesare sunt procesate de OpenAI. Copilotul poate citi registrul deschis, fără să modifice datele. Conversația nu se salvează în cont.":{en:`When you send, OpenAI processes your question and the required summaries. Copilot can read the current ledger but cannot change data. The conversation is not saved in your account.`,de:`Beim Senden verarbeitet OpenAI deine Frage und die benötigten Zusammenfassungen. Copilot kann das geöffnete Register lesen, aber keine Daten ändern. Das Gespräch wird nicht im Konto gespeichert.`,fr:`Lors de l’envoi, OpenAI traite votre question et les résumés nécessaires. Copilot peut lire le registre ouvert sans modifier les données. La conversation n’est pas enregistrée dans votre compte.`},"Perioadă pentru analiză":{en:`Analysis period`,de:`Analysezeitraum`,fr:`Période d’analyse`},"Datele menționate în întrebare au prioritate față de intervalul ales.":{en:`Dates in your question override the selected period.`,de:`Datumsangaben in deiner Frage haben Vorrang vor dem gewählten Zeitraum.`,fr:`Les dates indiquées dans votre question remplacent la période sélectionnée.`},"Conversație Copilot":{en:`Copilot conversation`,de:`Copilot-Gespräch`,fr:`Conversation Copilot`},"Cât am cheltuit în perioada selectată?":{en:`How much did I spend during the selected period?`,de:`Wie viel habe ich im gewählten Zeitraum ausgegeben?`,fr:`Combien ai-je dépensé pendant la période sélectionnée ?`},"Unde aș putea reduce cheltuielile?":{en:`Where could I reduce spending?`,de:`Wo könnte ich Ausgaben reduzieren?`,fr:`Où pourrais-je réduire mes dépenses ?`},"Care sunt ratele scadente în perioada selectată?":{en:`Which installments are due during the selected period?`,de:`Welche Raten sind im gewählten Zeitraum fällig?`,fr:`Quelles échéances sont dues pendant la période sélectionnée ?`},"Cât reprezintă 15% din 250?":{en:`What is 15% of 250?`,de:`Wie viel sind 15 % von 250?`,fr:`Combien font 15 % de 250 ?`},"Sold în perioada selectată":{en:`Balance for selected period`,de:`Saldo im gewählten Zeitraum`,fr:`Solde de la période sélectionnée`},"Înregistrări analizate":{en:`Entries analyzed`,de:`Analysierte Einträge`,fr:`Écritures analysées`},"Zile calendaristice":{en:`Calendar days`,de:`Kalendertage`,fr:`Jours calendaires`},"Cheltuială medie pe zi":{en:`Average daily spending`,de:`Durchschnittliche tägliche Ausgaben`,fr:`Dépense quotidienne moyenne`},"Venit mediu pe zi":{en:`Average daily income`,de:`Durchschnittliche tägliche Einnahmen`,fr:`Revenu quotidien moyen`},"Cheltuieli din venituri":{en:`Spending as a share of income`,de:`Ausgabenanteil am Einkommen`,fr:`Dépenses en proportion des revenus`},"Economie simulată":{en:`Simulated savings`,de:`Simulierte Ersparnis`,fr:`Économie simulée`},Rezultat:{en:`Result`,de:`Ergebnis`,fr:`Résultat`},"Sold rămas al creditelor":{en:`Outstanding loan balance`,de:`Verbleibende Kreditschuld`,fr:`Solde restant des crédits`},"Rate cu scadența în interval":{en:`Installments due in period`,de:`Im Zeitraum fällige Raten`,fr:`Échéances dues sur la période`},"Scadențe în interval":{en:`Due dates in period`,de:`Fälligkeiten im Zeitraum`,fr:`Échéances dans la période`},"Soldurile creditelor sunt cele actuale. Ratele includ doar următoarea scadență neplătită a fiecărui credit din interval, nu un grafic viitor de rambursare.":{en:`Loan balances are current. Installments include only each loan’s next unpaid due date within the period, not a future repayment schedule.`,de:`Die Kreditsalden sind aktuell. Raten umfassen nur die nächste unbezahlte Fälligkeit jedes Kredits im Zeitraum, keinen zukünftigen Tilgungsplan.`,fr:`Les soldes des crédits sont actuels. Les échéances comprennent uniquement la prochaine échéance impayée de chaque crédit dans la période, pas un tableau d’amortissement futur.`},"Simulare de reducere a cheltuielilor":{en:`Spending reduction simulation`,de:`Simulation einer Ausgabenreduzierung`,fr:`Simulation de réduction des dépenses`},"Răspuns AI":{en:`AI response`,de:`KI-Antwort`,fr:`Réponse IA`},"Calculele sunt disponibile; explicația AI nu a putut fi generată.":{en:`Calculations are available; the AI explanation could not be generated.`,de:`Die Berechnungen sind verfügbar; die KI-Erklärung konnte nicht erstellt werden.`,fr:`Les calculs sont disponibles ; l’explication IA n’a pas pu être générée.`},"Analizez întrebarea…":{en:`Analyzing your question…`,de:`Deine Frage wird analysiert…`,fr:`Analyse de votre question…`},"Întrebarea ta":{en:`Your question`,de:`Deine Frage`,fr:`Votre question`},"De exemplu: cât aș economisi dacă reduc cheltuielile cu 10%?":{en:`For example: how much would I save by reducing spending by 10%?`,de:`Zum Beispiel: Wie viel spare ich, wenn ich meine Ausgaben um 10 % reduziere?`,fr:`Par exemple : combien économiserais-je en réduisant les dépenses de 10 % ?`},"Calcule în cod · sugestii AI":{en:`Code-based calculations · AI suggestions`,de:`Berechnungen im Code · KI-Vorschläge`,fr:`Calculs par le code · suggestions IA`},"Nu mai ai acces la acest registru. Reîncarcă aplicația.":{en:`You no longer have access to this ledger. Reload the app.`,de:`Du hast keinen Zugriff mehr auf dieses Register. Lade die App neu.`,fr:`Vous n’avez plus accès à ce registre. Rechargez l’application.`},"Copilotul nu este încă activat pe server.":{en:`Copilot has not yet been enabled on the server.`,de:`Copilot ist auf dem Server noch nicht aktiviert.`,fr:`Copilot n’est pas encore activé sur le serveur.`},"Configurarea registrelor partajate este necesară pentru Copilot.":{en:`Shared ledger setup is required for Copilot.`,de:`Die Einrichtung geteilter Register ist für Copilot erforderlich.`,fr:`La configuration des registres partagés est nécessaire pour Copilot.`},"Mai trebuie instalată configurarea Copilotului în Supabase.":{en:`Copilot setup still needs to be installed in Supabase.`,de:`Die Copilot-Konfiguration muss noch in Supabase installiert werden.`,fr:`La configuration de Copilot doit encore être installée dans Supabase.`},"Administratorul trebuie să aleagă moneda registrului înainte de prima întrebare.":{en:`The administrator must select the ledger currency before the first question.`,de:`Der Administrator muss vor der ersten Frage die Registerwährung auswählen.`,fr:`L’administrateur doit choisir la devise du registre avant la première question.`},"Cheia AI nu este validă sau nu mai are acces. Administratorul trebuie să o verifice.":{en:`The AI key is invalid or no longer has access. The administrator must check it.`,de:`Der KI-Schlüssel ist ungültig oder hat keinen Zugriff mehr. Der Administrator muss ihn prüfen.`,fr:`La clé IA est invalide ou n’a plus accès. L’administrateur doit la vérifier.`},"Creditul API este epuizat. Administratorul trebuie să verifice facturarea OpenAI.":{en:`API credit is exhausted. The administrator must check OpenAI billing.`,de:`Das API-Guthaben ist aufgebraucht. Der Administrator muss die OpenAI-Abrechnung prüfen.`,fr:`Le crédit API est épuisé. L’administrateur doit vérifier la facturation OpenAI.`},"Serviciul AI este ocupat. Încearcă din nou puțin mai târziu.":{en:`The AI service is busy. Try again shortly.`,de:`Der KI-Dienst ist ausgelastet. Versuche es später erneut.`,fr:`Le service IA est occupé. Réessayez dans un instant.`},"Serviciul AI nu este disponibil momentan.":{en:`The AI service is currently unavailable.`,de:`Der KI-Dienst ist momentan nicht verfügbar.`,fr:`Le service IA est momentan indisponible.`},"Ai atins limita: 5 întrebări pe minut sau 30 pe zi. Încearcă mai târziu.":{en:`You reached the limit: 5 questions per minute or 30 per day. Try later.`,de:`Du hast das Limit erreicht: 5 Fragen pro Minute oder 30 pro Tag. Versuche es später erneut.`,fr:`Vous avez atteint la limite : 5 questions par minute ou 30 par jour. Réessayez plus tard.`},"Împărțirea la zero nu este posibilă.":{en:`Division by zero is not possible.`,de:`Division durch null ist nicht möglich.`,fr:`La division par zéro est impossible.`},"Sunt prea multe înregistrări. Alege un interval mai scurt.":{en:`There are too many entries. Choose a shorter period.`,de:`Zu viele Einträge. Wähle einen kürzeren Zeitraum.`,fr:`Trop d’écritures. Choisissez une période plus courte.`},"Verifică întrebarea și intervalul de date.":{en:`Check your question and date range.`,de:`Prüfe deine Frage und den Zeitraum.`,fr:`Vérifiez votre question et la période.`},"Nu am putut interpreta sigur întrebarea. Reformulează mai simplu.":{en:`I could not reliably interpret the question. Please simplify it.`,de:`Ich konnte die Frage nicht sicher interpretieren. Bitte formuliere sie einfacher.`,fr:`Je n’ai pas pu interpréter la question avec certitude. Reformulez-la plus simplement.`},"Răspunsul AI este incomplet. Încearcă o întrebare mai scurtă.":{en:`The AI response is incomplete. Try a shorter question.`,de:`Die KI-Antwort ist unvollständig. Versuche eine kürzere Frage.`,fr:`La réponse IA est incomplète. Essayez une question plus courte.`},"Reformulează întrebarea despre registru sau calcul.":{en:`Rephrase your question about the ledger or calculation.`,de:`Formuliere deine Frage zum Register oder zur Berechnung neu.`,fr:`Reformulez votre question sur le registre ou le calcul.`},"Nu am putut încărca datele. Nu am calculat un total parțial.":{en:`Data could not be loaded. No partial total was calculated.`,de:`Daten konnten nicht geladen werden. Es wurde keine unvollständige Summe berechnet.`,fr:`Les données n’ont pas pu être chargées. Aucun total partiel n’a été calculé.`},"Rezultatul este prea mare pentru acest calcul.":{en:`The result is too large for this calculation.`,de:`Das Ergebnis ist für diese Berechnung zu groß.`,fr:`Le résultat est trop grand pour ce calcul.`},"Răspunsul durează prea mult. Încearcă din nou.":{en:`The response timed out. Try again.`,de:`Die Antwort dauert zu lange. Versuche es erneut.`,fr:`La réponse prend trop de temps. Réessayez.`},"Copilotul nu a putut răspunde. Încearcă din nou.":{en:`Copilot could not respond. Try again.`,de:`Copilot konnte nicht antworten. Versuche es erneut.`,fr:`Copilot n’a pas pu répondre. Réessayez.`},"Nu pot contacta Copilotul. Verifică internetul și dacă funcția registry-copilot a fost publicată.":{en:`Cannot contact Copilot. Check your connection and whether registry-copilot has been deployed.`,de:`Copilot ist nicht erreichbar. Prüfe die Internetverbindung und ob registry-copilot bereitgestellt wurde.`,fr:`Impossible de contacter Copilot. Vérifiez la connexion et si registry-copilot a été déployée.`},"Până la":{en:`Until`,de:`Bis`,fr:`Jusqu’au`},"Cheltuieli pe categorii":{en:`Spending by category`,de:`Ausgaben nach Kategorie`,fr:`Dépenses par catégorie`},Trimite:{en:`Send`,de:`Senden`,fr:`Envoyer`},"Șterge creditul":{en:`Delete loan`,de:`Kredit löschen`,fr:`Supprimer le crédit`},"Ștergi acest credit?":{en:`Delete this loan?`,de:`Diesen Kredit löschen?`,fr:`Supprimer ce crédit ?`},"Creditul către {0}, cu soldul rămas {1}, va fi șters definitiv împreună cu istoricul ratelor și notificările programate. Înregistrările din Istoric venituri/cheltuieli nu se modifică.":{en:`The loan to {0}, with an outstanding balance of {1}, will be permanently deleted along with its payment history and scheduled reminders. Income/expense history will not change.`,de:`Der Kredit bei {0} mit einer Restschuld von {1} wird zusammen mit seinem Zahlungsverlauf und geplanten Erinnerungen endgültig gelöscht. Der Einnahmen-/Ausgabenverlauf bleibt unverändert.`,fr:`Le crédit auprès de {0}, avec un solde restant de {1}, sera définitivement supprimé avec son historique de paiements et ses rappels programmés. L’historique des revenus et dépenses reste inchangé.`},"Un e-mail deja trimis sau aflat în curs de expediere nu poate fi retras.":{en:`An email already sent or being sent cannot be recalled.`,de:`Eine bereits versandte oder gerade versendete E-Mail kann nicht zurückgerufen werden.`,fr:`Un e-mail déjà envoyé ou en cours d’envoi ne peut pas être rappelé.`},"Se șterge…":{en:`Deleting…`,de:`Wird gelöscht…`,fr:`Suppression…`},"Șterge definitiv":{en:`Delete permanently`,de:`Endgültig löschen`,fr:`Supprimer définitivement`},"Creditul a fost șters.":{en:`Loan deleted.`,de:`Kredit gelöscht.`,fr:`Crédit supprimé.`},"Ștergerea creditelor trebuie activată de administrator.":{en:`Loan deletion must be enabled by the administrator.`,de:`Das Löschen von Krediten muss vom Administrator aktiviert werden.`,fr:`La suppression des crédits doit être activée par l’administrateur.`},"Nu ai permisiunea să ștergi acest credit.":{en:`You do not have permission to delete this loan.`,de:`Du darfst diesen Kredit nicht löschen.`,fr:`Vous n’avez pas l’autorisation de supprimer ce crédit.`},"Creditul nu mai există. Reîncarcă lista.":{en:`The loan no longer exists. Reload the list.`,de:`Der Kredit existiert nicht mehr. Lade die Liste neu.`,fr:`Le crédit n’existe plus. Rechargez la liste.`},"Creditul a fost modificat pe alt dispozitiv. Reîncarcă lista înainte de ștergere.":{en:`The loan was changed on another device. Reload the list before deleting.`,de:`Der Kredit wurde auf einem anderen Gerät geändert. Lade die Liste vor dem Löschen neu.`,fr:`Le crédit a été modifié sur un autre appareil. Rechargez la liste avant de le supprimer.`},"Nu am putut confirma ștergerea. Reîncarcă lista înainte de a reîncerca.":{en:`Deletion could not be confirmed. Reload the list before retrying.`,de:`Das Löschen konnte nicht bestätigt werden. Lade die Liste vor einem erneuten Versuch neu.`,fr:`La suppression n’a pas pu être confirmée. Rechargez la liste avant de réessayer.`},"Plată parțială":{en:`Partial payment`,de:`Teilzahlung`,fr:`Paiement partiel`},"{0} luni":{en:`{0} months`,de:`{0} Monate`,fr:`{0} mois`},"Durată estimată în funcție de rata lunară":{en:`Estimated duration based on the monthly installment`,de:`Geschätzte Laufzeit anhand der Monatsrate`,fr:`Durée estimée selon la mensualité`},"Sold împărțit la rata lunară, rotunjit în sus. Fără dobânzi sau comisioane suplimentare.":{en:`Balance divided by the monthly installment, rounded up. No additional interest or fees.`,de:`Restschuld geteilt durch die Monatsrate, aufgerundet. Ohne zusätzliche Zinsen oder Gebühren.`,fr:`Solde divisé par la mensualité, arrondi au supérieur. Hors intérêts ou frais supplémentaires.`},"Plata a fost salvată. Soldul a fost actualizat.":{en:`Payment saved. Balance updated.`,de:`Zahlung gespeichert. Restschuld aktualisiert.`,fr:`Paiement enregistré. Solde actualisé.`},"Suma se scade din sold. Plățile parțiale se adună pentru rata curentă; scadența avansează o lună când rata este acoperită. O sumă mai mare reduce soldul, fără să achite automat alte scadențe. Plata apare în istoricul creditului, nu și la cheltuieli.":{en:`The amount reduces the balance. Partial payments add up toward the current installment; the due date advances one month when it is covered. Any excess reduces the balance without automatically
