d verified email address.`,de:`Nimm die Einladung mit der eingeladenen und bestätigten E-Mail-Adresse an.`,fr:`Acceptez avec le compte dont l’adresse invitée a été confirmée.`},"Ai intrat în registrul partajat.":{en:`You joined the shared ledger.`,de:`Du bist dem gemeinsamen Haushaltsbuch beigetreten.`,fr:`Vous avez rejoint le registre partagé.`},"Acceptă invitația":{en:`Accept invitation`,de:`Einladung annehmen`,fr:`Accepter l’invitation`},Renunță:{en:`Cancel`,de:`Abbrechen`,fr:`Annuler`},"Membrii registrului":{en:`Ledger members`,de:`Mitglieder des Haushaltsbuchs`,fr:`Membres du registre`},"Invitațiile vor fi disponibile după instalarea configurării „Cont și partajare” în Supabase.":{en:`Invitations require the account and sharing setup in Supabase.`,de:`Einladungen erfordern die Konto- und Freigabekonfiguration in Supabase.`,fr:`Les invitations nécessitent la configuration du compte et du partage dans Supabase.`},"Acest registru aparține lui":{en:`This ledger belongs to`,de:`Dieses Haushaltsbuch gehört`,fr:`Ce registre appartient à`},". Numai administratorul poate invita membri sau schimba permisiunile.":{en:`. Only the administrator can invite members or change permissions.`,de:`. Nur der Administrator kann Mitglieder einladen oder Berechtigungen ändern.`,fr:`. Seul l’administrateur peut inviter des membres ou modifier les autorisations.`},"Tu ești administrator. Poți adăuga maximum doi membri. Ei vor avea acces la veniturile, cheltuielile, bonurile, rapoartele și creditele acestui registru.":{en:`You are the administrator. Add up to two members with access to this ledger’s income, expenses, receipts, reports and loans.`,de:`Du bist Administrator. Du kannst bis zu zwei Mitglieder mit Zugriff auf Einnahmen, Ausgaben, Belege, Berichte und Kredite hinzufügen.`,fr:`Vous êtes administrateur. Ajoutez jusqu’à deux membres ayant accès aux revenus, dépenses, justificatifs, rapports et crédits de ce registre.`},Reîncearcă:{en:`Try again`,de:`Erneut versuchen`,fr:`Réessayer`},"E-mailul persoanei invitate":{en:`Invitee’s email`,de:`E-Mail der eingeladenen Person`,fr:`E-mail de la personne invitée`},Acces:{en:`Access`,de:`Zugriff`,fr:`Accès`},"Poate adăuga, modifica și șterge date":{en:`Can add, edit and delete data`,de:`Kann Daten hinzufügen, ändern und löschen`,fr:`Peut ajouter, modifier et supprimer des données`},"Doar citire și export":{en:`View and export only`,de:`Nur ansehen und exportieren`,fr:`Consultation et export uniquement`},"Creează invitația":{en:`Create invitation`,de:`Einladung erstellen`,fr:`Créer l’invitation`},"Invitație creată, valabilă 7 zile. Copiază linkul sau trimite-l prin e-mail.":{en:`Invitation created, valid for 7 days. Copy the link or send it by email.`,de:`Einladung erstellt, 7 Tage gültig. Kopiere den Link oder sende ihn per E-Mail.`,fr:`Invitation créée, valable 7 jours. Copiez le lien ou envoyez-le par e-mail.`},"Link invitație":{en:`Invitation link`,de:`Einladungslink`,fr:`Lien d’invitation`},"Linkul invitației a fost copiat.":{en:`Invitation link copied.`,de:`Einladungslink kopiert.`,fr:`Lien d’invitation copié.`},"Copiază linkul":{en:`Copy link`,de:`Link kopieren`,fr:`Copier le lien`},"E-mailul nu a putut fi trimis. Serviciul de invitații trebuie configurat; poți copia linkul.":{en:`Could not send email. Configure the invitation service or copy the link.`,de:`E-Mail konnte nicht gesendet werden. Konfiguriere den Einladungsdienst oder kopiere den Link.`,fr:`Impossible d’envoyer l’e-mail. Configurez le service d’invitations ou copiez le lien.`},"Invitația a fost acceptată pentru trimitere prin e-mail.":{en:`Invitation accepted for email delivery.`,de:`Einladung zum E-Mail-Versand angenommen.`,fr:`Invitation acceptée pour envoi par e-mail.`},"Trimite e-mailul":{en:`Send email`,de:`E-Mail senden`,fr:`Envoyer l’e-mail`},Permisiuni:{en:`Permissions`,de:`Berechtigungen`,fr:`Autorisations`},Editare:{en:`Edit`,de:`Bearbeiten`,fr:`Modification`},"Doar citire":{en:`Read only`,de:`Nur lesen`,fr:`Lecture seule`},"Retragi accesul lui {0} la registrul tău?":{en:`Revoke {0}’s access to your ledger?`,de:`Zugriff von {0} auf dein Haushaltsbuch widerrufen?`,fr:`Retirer à {0} l’accès à votre registre ?`},"Accesul membrului a fost revocat.":{en:`Member access revoked.`,de:`Mitgliedszugriff widerrufen.`,fr:`Accès du membre révoqué.`},"Revocă accesul":{en:`Revoke access`,de:`Zugriff widerrufen`,fr:`Révoquer l’accès`},"· invitație în așteptare":{en:`· invitation pending`,de:`· Einladung ausstehend`,fr:`· invitation en attente`},"Anulează invitația":{en:`Cancel invitation`,de:`Einladung zurückziehen`,fr:`Annuler l’invitation`},"Se deschide registrul…":{en:`Opening your ledger…`,de:`Haushaltsbuch wird geöffnet…`,fr:`Ouverture du registre…`},"Configurarea conturilor nu este finalizată":{en:`Account setup is incomplete`,de:`Kontoeinrichtung unvollständig`,fr:`Configuration des comptes incomplète`},"Registrul este pregătit pentru conturi individuale, dar trebuie conectat la baza de date înainte de publicare.":{en:`The ledger supports individual accounts but must be connected to the database before publishing.`,de:`Das Haushaltsbuch unterstützt persönliche Konten, muss aber vor der Veröffentlichung mit der Datenbank verbunden werden.`,fr:`Le registre prend en charge les comptes individuels, mais doit être connecté à la base de données avant publication.`},"Introdu numele tău.":{en:`Enter your name.`,de:`Gib deinen Namen ein.`,fr:`Saisissez votre nom.`},"Parola trebuie să aibă minimum 8 caractere.":{en:`Your password must contain at least 8 characters.`,de:`Das Passwort muss mindestens 8 Zeichen enthalten.`,fr:`Le mot de passe doit contenir au moins 8 caractères.`},"Contul a fost creat.":{en:`Account created.`,de:`Konto erstellt.`,fr:`Compte créé.`},"Autentificarea nu a reușit.":{en:`Sign-in failed.`,de:`Anmeldung fehlgeschlagen.`,fr:`Échec de la connexion.`},"E-mail sau parolă incorectă.":{en:`Incorrect email or password.`,de:`E-Mail oder Passwort falsch.`,fr:`E-mail ou mot de passe incorrect.`},"Verifică e-mailul":{en:`Check your email`,de:`Prüfe deine E-Mails`,fr:`Consultez vos e-mails`},"Am trimis un mesaj la":{en:`We sent a message to`,de:`Wir haben eine Nachricht gesendet an`,fr:`Nous avons envoyé un message à`},". Deschide linkul din mesaj, apoi te poți conecta.":{en:`. Open the link in the message, then sign in.`,de:`. Öffne den Link in der Nachricht und melde dich dann an.`,fr:`. Ouvrez le lien du message, puis connectez-vous.`},"Mergi la conectare":{en:`Go to sign in`,de:`Zur Anmeldung`,fr:`Aller à la connexion`},"Banii și bonurile tale, într-un singur loc.":{en:`Your money and receipts, all in one place.`,de:`Dein Geld und deine Belege an einem Ort.`,fr:`Votre argent et vos justificatifs au même endroit.`},"Intră de pe orice telefon sau calculator. Tot ce salvezi rămâne în contul tău.":{en:`Sign in from any phone or computer. Everything you save stays in your account.`,de:`Melde dich mit jedem Telefon oder Computer an. Alles bleibt in deinem Konto gespeichert.`,fr:`Connectez-vous depuis un téléphone ou un ordinateur. Tout reste enregistré dans votre compte.`},"Datele sunt private. Poți folosi registrul personal sau unul partajat prin invitație.":{en:`Your data is private. Use your personal ledger or a shared one by invitation.`,de:`Deine Daten sind privat. Nutze dein eigenes Haushaltsbuch oder ein per Einladung geteiltes.`,fr:`Vos données sont privées. Utilisez votre registre personnel ou un registre partagé sur invitation.`},Conectare:{en:`Sign in`,de:`Anmelden`,fr:`Connexion`},"Cont nou":{en:`New account`,de:`Neues Konto`,fr:`Nouveau compte`},"Bine ai revenit":{en:`Welcome back`,de:`Willkommen zurück`,fr:`Bon retour`},"Începe acum":{en:`Get started`,de:`Jetzt starten`,fr:`Commencer`},"Intră în cont":{en:`Sign in to your account`,de:`Bei deinem Konto anmelden`,fr:`Connectez-vous à votre compte`},"Creează contul tău":{en:`Create your account`,de:`Erstelle dein Konto`,fr:`Créez votre compte`},"Face ID / cheie de acces":{en:`Face ID / passkey`,de:`Face ID / Passkey`,fr:`Face ID / clé d’accès`},"Prima dată, intră cu parola și adaugă o cheie din Siguranță. Ulterior te poți conecta fără să scrii parola.":{en:`First sign in with your password and add a passkey under Security. Then sign in without typing your password.`,de:`Melde dich zuerst mit Passwort an und füge unter Sicherheit einen Passkey hinzu. Danach geht es ohne Passworteingabe.`,fr:`Connectez-vous d’abord avec votre mot de passe et ajoutez une clé dans Sécurité. Vous pourrez ensuite vous connecter sans saisir de mot de passe.`},"Cheile de acces nu sunt disponibile în acest browser. Folosește e-mailul și parola.":{en:`Passkeys are unavailable in this browser. Use email and password.`,de:`Passkeys sind in diesem Browser nicht verfügbar. Verwende E-Mail und Passwort.`,fr:`Les clés d’accès ne sont pas disponibles dans ce navigateur. Utilisez l’e-mail et le mot de passe.`},"Ai o invitație la un registru partajat. Conectează-te sau creează un cont cu adresa invitată, apoi acceptă invitația din Contul meu.":{en:`You have a shared ledger invitation. Sign in or create an account with the invited email, then accept it in My account.`,de:`Du hast eine Einladung zu einem gemeinsamen Haushaltsbuch. Melde dich mit der eingeladenen E-Mail an und nimm sie unter Mein Konto an.`,fr:`Vous avez une invitation à un registre partagé. Connectez-vous ou créez un compte avec l’adresse invitée, puis acceptez dans Mon compte.`},Nume:{en:`Name`,de:`Name`,fr:`Nom`},"Numele tău":{en:`Your name`,de:`Dein Name`,fr:`Votre nom`},"E-mail":{en:`Email`,de:`E-Mail`,fr:`E-mail`},Parolă:{en:`Password`,de:`Passwort`,fr:`Mot de passe`},"Ascunde parola":{en:`Hide password`,de:`Passwort verbergen`,fr:`Masquer le mot de passe`},"Arată parola":{en:`Show password`,de:`Passwort anzeigen`,fr:`Afficher le mot de passe`},"Se verifică…":{en:`Checking…`,de:`Wird geprüft…`,fr:`Vérification…`},"Intră în registru":{en:`Open ledger`,de:`Haushaltsbuch öffnen`,fr:`Ouvrir le registre`},"Creează cont":{e ndheit, Bildung, Wohnen oder Rechnungen. Die Analyse bleibt im Browser und sendet keine Einträge an einen KI-Dienst.`,fr:`Aucune réduction automatique pour santé, éducation, logement ou factures. L’analyse reste dans le navigateur sans envoi des opérations à un service d’IA.`},"Cheia de acces a fost adăugată. La următoarea conectare poți folosi Face ID / cheie de acces.":{en:`Passkey added. Next time you can sign in with Face ID / passkey.`,de:`Passkey hinzugefügt. Bei der nächsten Anmeldung kannst du Face ID / Passkey verwenden.`,fr:`Clé ajoutée. Vous pourrez utiliser Face ID / clé d’accès lors de la prochaine connexion.`},"Cheia a fost revocată pentru acest cont. O poți șterge și din managerul de parole al dispozitivului.":{en:`Passkey revoked for this account. You can also delete it from your device’s password manager.`,de:`Passkey für dieses Konto widerrufen. Du kannst ihn auch im Passwortmanager des Geräts löschen.`,fr:`Clé révoquée pour ce compte. Vous pouvez aussi la supprimer du gestionnaire de mots de passe de l’appareil.`},"Siguranța contului":{en:`Account security`,de:`Kontosicherheit`,fr:`Sécurité du compte`},"Face ID și chei de acces":{en:`Face ID and passkeys`,de:`Face ID und Passkeys`,fr:`Face ID et clés d’accès`},"Adaugă o cheie de acces după ce te-ai conectat cu parola. Pe iPhone poți confirma cu Face ID; pe alte dispozitive, cu amprenta sau codul permis de dispozitiv.":{en:`Add a passkey after signing in with your password. On iPhone, confirm with Face ID; on other devices, use a fingerprint or device PIN.`,de:`Füge nach der Passwortanmeldung einen Passkey hinzu. Auf dem iPhone mit Face ID bestätigen, auf anderen Geräten per Fingerabdruck oder Gerätecode.`,fr:`Ajoutez une clé après connexion avec le mot de passe. Sur iPhone, confirmez avec Face ID ; ailleurs, utilisez l’empreinte ou le code de l’appareil.`},"Fața și amprenta ta nu sunt trimise aplicației. Verificarea se face pe dispozitiv. E-mailul și parola rămân disponibile pentru recuperarea accesului.":{en:`Your face and fingerprint are not sent to the app. Verification happens on your device. Email and password remain available to recover access.`,de:`Gesicht und Fingerabdruck werden nicht an die App gesendet. Die Prüfung erfolgt auf dem Gerät. E-Mail und Passwort bleiben zur Wiederherstellung verfügbar.`,fr:`Votre visage et vos empreintes ne sont pas envoyés à l’application. La vérification se fait sur l’appareil. E-mail et mot de passe restent disponibles pour récupérer l’accès.`},"Acest browser nu permite chei de acces aici. Deschide aplicația la adresa HTTPS într-un browser compatibil.":{en:`This browser cannot use passkeys here. Open the HTTPS app in a compatible browser.`,de:`Dieser Browser unterstützt hier keine Passkeys. Öffne die HTTPS-App in einem kompatiblen Browser.`,fr:`Ce navigateur ne permet pas les clés d’accès ici. Ouvrez l’adresse HTTPS dans un navigateur compatible.`},"Se așteaptă confirmarea…":{en:`Waiting for confirmation…`,de:`Warte auf Bestätigung…`,fr:`En attente de confirmation…`},"Adaugă Face ID / cheie de acces":{en:`Add Face ID / passkey`,de:`Face ID / Passkey hinzufügen`,fr:`Ajouter Face ID / clé d’accès`},"Cheile contului tău":{en:`Your account’s passkeys`,de:`Passkeys deines Kontos`,fr:`Clés de votre compte`},"Lista cheilor nu a putut fi verificată.":{en:`Could not check passkeys.`,de:`Passkeys konnten nicht geprüft werden.`,fr:`Impossible de vérifier les clés.`},"Nu ai adăugat încă o cheie de acces.":{en:`You have not added a passkey yet.`,de:`Du hast noch keinen Passkey hinzugefügt.`,fr:`Vous n’avez pas encore ajouté de clé d’accès.`},"Cheie de acces":{en:`Passkey`,de:`Passkey`,fr:`Clé d’accès`},"Adăugată la":{en:`Added on`,de:`Hinzugefügt am`,fr:`Ajoutée le`},"Revoci această cheie? Asigură-te că îți cunoști parola sau ai altă cheie de acces.":{en:`Revoke this passkey? Make sure you know your password or have another passkey.`,de:`Diesen Passkey widerrufen? Stelle sicher, dass du dein Passwort kennst oder einen anderen Passkey hast.`,fr:`Révoquer cette clé ? Vérifiez que vous connaissez votre mot de passe ou disposez d’une autre clé.`},"Revocă cheia":{en:`Revoke passkey`,de:`Passkey widerrufen`,fr:`Révoquer la clé`},Revocă:{en:`Revoke`,de:`Widerrufen`,fr:`Révoquer`},"Parolele nu coincid.":{en:`Passwords do not match.`,de:`Passwörter stimmen nicht überein.`,fr:`Les mots de passe ne correspondent pas.`},"Deschide aplicația publicată online pentru a solicita un link de resetare.":{en:`Open the published app online to request a reset link.`,de:`Öffne die veröffentlichte Online-App, um einen Link anzufordern.`,fr:`Ouvrez l’application publiée en ligne pour demander un lien de réinitialisation.`},"Prea multe încercări. Așteaptă câteva minute și încearcă din nou.":{en:`Too many attempts. Wait a few minutes and try again.`,de:`Zu viele Versuche. Warte einige Minuten und versuche es erneut.`,fr:`Trop de tentatives. Attendez quelques minutes et réessayez.`},"Alege o parolă diferită de cea veche.":{en:`Choose a different password.`,de:`Wähle ein anderes Passwort.`,fr:`Choisissez un mot de passe différent de l’ancien.`},"Alege o parolă mai puternică, cu litere, cifre și simboluri.":{en:`Choose a stronger password with letters, numbers and symbols.`,de:`Wähle ein stärkeres Passwort mit Buchstaben, Zahlen und Symbolen.`,fr:`Choisissez un mot de passe plus fort avec lettres, chiffres et symboles.`},"Parola nu a putut fi schimbată. Linkul poate fi expirat; solicită un link nou și încearcă din nou.":{en:`Could not change password. The link may have expired; request a new one.`,de:`Passwort konnte nicht geändert werden. Der Link ist möglicherweise abgelaufen; fordere einen neuen an.`,fr:`Impossible de modifier le mot de passe. Le lien a peut-être expiré ; demandez-en un nouveau.`},"Nu am putut trimite e-mailul. Încearcă din nou mai târziu.":{en:`Could not send email. Try again later.`,de:`E-Mail konnte nicht gesendet werden. Versuche es später erneut.`,fr:`Impossible d’envoyer l’e-mail. Réessayez plus tard.`},"Parola a fost schimbată":{en:`Password changed`,de:`Passwort geändert`,fr:`Mot de passe modifié`},"Setează parola nouă":{en:`Set a new password`,de:`Neues Passwort festlegen`,fr:`Définir un nouveau mot de passe`},"Parola nouă este salvată. O poți folosi la următoarea conectare.":{en:`New password saved. Use it the next time you sign in.`,de:`Neues Passwort gespeichert. Verwende es bei der nächsten Anmeldung.`,fr:`Nouveau mot de passe enregistré. Utilisez-le à la prochaine connexion.`},"Dacă există un cont asociat acestei adrese, vei primi un link pentru resetarea parolei. Verifică și folderul Spam.":{en:`If an account exists for this address, you will receive a password reset link. Check Spam too.`,de:`Falls ein Konto zu dieser Adresse existiert, erhältst du einen Link zum Zurücksetzen. Prüfe auch den Spamordner.`,fr:`Si un compte existe pour cette adresse, vous recevrez un lien de réinitialisation. Vérifiez aussi les indésirables.`},"Introdu parola nouă de două ori.":{en:`Enter the new password twice.`,de:`Gib das neue Passwort zweimal ein.`,fr:`Saisissez deux fois le nouveau mot de passe.`},"Linkul lipsește, a expirat sau nu mai este valid. Introdu e-mailul pentru a solicita unul nou.":{en:`The link is missing, expired or invalid. Enter your email to request a new one.`,de:`Der Link fehlt, ist abgelaufen oder ungültig. Gib deine E-Mail für einen neuen Link ein.`,fr:`Le lien manque, a expiré ou n’est plus valide. Saisissez votre e-mail pour en demander un nouveau.`},"Introdu adresa de e-mail a contului. Îți trimitem un link pentru alegerea unei parole noi.":{en:`Enter your account email. We will send a link to choose a new password.`,de:`Gib deine Konto-E-Mail ein. Wir senden einen Link zur Wahl eines neuen Passworts.`,fr:`Saisissez l’e-mail du compte. Nous enverrons un lien pour choisir un nouveau mot de passe.`},"Parola nouă":{en:`New password`,de:`Neues Passwort`,fr:`Nouveau mot de passe`},"Confirmă parola nouă":{en:`Confirm new password`,de:`Neues Pa mailul și parola.":{en:`Passkey sign-in is not enabled for this app yet. Use email and password.`,de:`Passkey-Anmeldung ist noch nicht aktiviert. Verwende E-Mail und Passwort.`,fr:`La connexion par clé d’accès n’est pas encore activée. Utilisez e-mail et mot de passe.`},"Confirmă întâi adresa de e-mail, apoi adaugă cheia de acces.":{en:`Verify your email first, then add a passkey.`,de:`Bestätige zuerst deine E-Mail und füge dann einen Passkey hinzu.`,fr:`Confirmez d’abord votre e-mail, puis ajoutez une clé d’accès.`},"Această cheie de acces este deja înregistrată.":{en:`This passkey is already registered.`,de:`Dieser Passkey ist bereits registriert.`,fr:`Cette clé d’accès est déjà enregistrée.`},"Cheia de acces nu este asociată contului. Intră cu parola și adaugă o cheie din Siguranță.":{en:`This passkey is not linked to the account. Sign in with your password and add one under Security.`,de:`Dieser Passkey ist nicht mit dem Konto verknüpft. Melde dich mit Passwort an und füge unter Sicherheit einen hinzu.`,fr:`Cette clé n’est pas associée au compte. Connectez-vous avec le mot de passe et ajoutez une clé dans Sécurité.`},"Cheia de acces nu este configurată pentru această adresă a aplicației. Folosește parola.":{en:`Passkey is not configured for this app address. Use your password.`,de:`Passkey ist für diese App-Adresse nicht konfiguriert. Verwende dein Passwort.`,fr:`La clé n’est pas configurée pour cette adresse. Utilisez votre mot de passe.`},"Operația cu cheia de acces nu a reușit. Încearcă din nou sau folosește e-mailul și parola.":{en:`Passkey operation failed. Try again or use email and password.`,de:`Passkey-Vorgang fehlgeschlagen. Versuche es erneut oder verwende E-Mail und Passwort.`,fr:`L’opération avec la clé a échoué. Réessayez ou utilisez e-mail et mot de passe.`},"Raportul nu a putut fi încărcat complet.":{en:`Could not load the full report.`,de:`Bericht konnte nicht vollständig geladen werden.`,fr:`Impossible de charger tout le rapport.`},"Perioada ar
